    <link id="pwa-manifest" rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        try {
          var p = window.location.pathname.toLowerCase();
          var s = window.location.search.toLowerCase();
          var lastMode = '';
          try { lastMode = localStorage.getItem('travelx_last_mode') || ''; } catch(_) {}
          var el = document.getElementById('pwa-manifest');
          if (!el) return;
          if (p.startsWith('/admin') || s.includes('admin') || (lastMode === 'admin' && !p.startsWith('/staff'))) {
            el.href = '/manifest-admin.json';
          } else if (p.startsWith('/staff') || s.includes('staff') || lastMode === 'staff') {
            el.href = '/manifest-staff.json';
          }
        } catch (_) {}
      })();
    </script>
